name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: java-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: 'java-server/**/pom.xml'
      - run: mvn --batch-mode --no-transfer-progress verify

  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-service
    env:
      OFFICECARE_ENVIRONMENT: test
      OFFICECARE_LANGSMITH_ENABLED: 'false'
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: 'ai-service/requirements*.txt'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -p pytest_asyncio.plugin -o addopts='' -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-admin/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build:prod
