name: officecare-app

services:
  officecare-rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: officecare-rabbitmq
    hostname: officecare-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${OFFICECARE_RABBITMQ_USERNAME:?Set OFFICECARE_RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${OFFICECARE_RABBITMQ_PASSWORD:?Set OFFICECARE_RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${OFFICECARE_RABBITMQ_VHOST:-/officecare}
    ports:
      - "${OFFICECARE_RABBITMQ_AMQP_PORT:-5673}:5672"
      - "${OFFICECARE_RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    volumes:
      - officecare-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - officecare-network
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  officecare-ai:
    build:
      context: ../../ai-service
      dockerfile: Dockerfile
    image: officecare-ai-service:${OFFICECARE_IMAGE_TAG:-0.1.0}
    container_name: officecare-ai-service
    restart: unless-stopped
    environment:
      OFFICECARE_ENVIRONMENT: production
      OFFICECARE_AI_SERVICE_TOKEN: ${OFFICECARE_AI_SERVICE_TOKEN:?Set OFFICECARE_AI_SERVICE_TOKEN}
      OFFICECARE_MAX_DOCUMENT_SIZE_MB: ${OFFICECARE_MAX_DOCUMENT_SIZE_MB:-30}
      OFFICECARE_DOCUMENT_PARSER: ${OFFICECARE_DOCUMENT_PARSER:-mineru}
      OFFICECARE_MINERU_BASE_URL: ${OFFICECARE_MINERU_BASE_URL:-https://mineru.net}
      OFFICECARE_MINERU_API_TOKEN: ${OFFICECARE_MINERU_API_TOKEN:?Set OFFICECARE_MINERU_API_TOKEN}
      OFFICECARE_MINERU_MODEL_VERSION: ${OFFICECARE_MINERU_MODEL_VERSION:-vlm}
      OFFICECARE_MINERU_LANGUAGE: ${OFFICECARE_MINERU_LANGUAGE:-ch}
      OFFICECARE_MINERU_IS_OCR: ${OFFICECARE_MINERU_IS_OCR:-false}
      OFFICECARE_MINERU_ENABLE_TABLE: ${OFFICECARE_MINERU_ENABLE_TABLE:-true}
      OFFICECARE_MINERU_ENABLE_FORMULA: ${OFFICECARE_MINERU_ENABLE_FORMULA:-false}
      OFFICECARE_MINERU_REQUEST_TIMEOUT_SECONDS: ${OFFICECARE_MINERU_REQUEST_TIMEOUT_SECONDS:-60}
      OFFICECARE_MINERU_POLL_INTERVAL_SECONDS: ${OFFICECARE_MINERU_POLL_INTERVAL_SECONDS:-5}
      OFFICECARE_MINERU_TIMEOUT_SECONDS: ${OFFICECARE_MINERU_TIMEOUT_SECONDS:-1800}
      OFFICECARE_MINERU_MAX_RESULT_SIZE_MB: ${OFFICECARE_MINERU_MAX_RESULT_SIZE_MB:-200}
      OFFICECARE_MINERU_MAX_PAGES_PER_PART: ${OFFICECARE_MINERU_MAX_PAGES_PER_PART:-200}
      OFFICECARE_EMBEDDING_BASE_URL: ${OFFICECARE_EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      OFFICECARE_EMBEDDING_API_KEY: ${OFFICECARE_EMBEDDING_API_KEY:?Set OFFICECARE_EMBEDDING_API_KEY}
      OFFICECARE_EMBEDDING_MODEL: ${OFFICECARE_EMBEDDING_MODEL:-Qwen/Qwen3-VL-Embedding-8B}
      OFFICECARE_EMBEDDING_DIMENSION: ${OFFICECARE_EMBEDDING_DIMENSION:-4096}
      OFFICECARE_EMBEDDING_BATCH_SIZE: ${OFFICECARE_EMBEDDING_BATCH_SIZE:-8}
      OFFICECARE_EMBEDDING_TIMEOUT_SECONDS: ${OFFICECARE_EMBEDDING_TIMEOUT_SECONDS:-60}
      OFFICECARE_CHAT_BASE_URL: ${OFFICECARE_CHAT_BASE_URL:-https://api.deepseek.com}
      OFFICECARE_CHAT_API_KEY: ${OFFICECARE_CHAT_API_KEY:?Set OFFICECARE_CHAT_API_KEY}
      OFFICECARE_CHAT_MODEL: ${OFFICECARE_CHAT_MODEL:-deepseek-v4-pro}
      OFFICECARE_CHAT_TEMPERATURE: ${OFFICECARE_CHAT_TEMPERATURE:-0.1}
      OFFICECARE_CHAT_TIMEOUT_SECONDS: ${OFFICECARE_CHAT_TIMEOUT_SECONDS:-120}
      OFFICECARE_CHAT_MAX_TOKENS: ${OFFICECARE_CHAT_MAX_TOKENS:-1200}
      OFFICECARE_AGENT_MAX_STEPS: ${OFFICECARE_AGENT_MAX_STEPS:-8}
      OFFICECARE_AGENT_MEMORY_ENABLED: ${OFFICECARE_AGENT_MEMORY_ENABLED:-true}
      OFFICECARE_AGENT_POSTGRES_DSN: ${OFFICECARE_AGENT_POSTGRES_DSN:?Set OFFICECARE_AGENT_POSTGRES_DSN}
      OFFICECARE_AGENT_POSTGRES_POOL_SIZE: ${OFFICECARE_AGENT_POSTGRES_POOL_SIZE:-5}
      OFFICECARE_AGENT_RECENT_MESSAGE_LIMIT: ${OFFICECARE_AGENT_RECENT_MESSAGE_LIMIT:-12}
      OFFICECARE_AGENT_SUMMARY_TRIGGER_MESSAGES: ${OFFICECARE_AGENT_SUMMARY_TRIGGER_MESSAGES:-20}
      OFFICECARE_LANGSMITH_ENABLED: ${OFFICECARE_LANGSMITH_ENABLED:-false}
      OFFICECARE_LANGSMITH_API_KEY: ${OFFICECARE_LANGSMITH_API_KEY:-}
      OFFICECARE_LANGSMITH_ENDPOINT: ${OFFICECARE_LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      OFFICECARE_LANGSMITH_PROJECT: ${OFFICECARE_LANGSMITH_PROJECT:-officecare-ai}
      OFFICECARE_LANGSMITH_HIDE_INPUTS: ${OFFICECARE_LANGSMITH_HIDE_INPUTS:-true}
      OFFICECARE_LANGSMITH_HIDE_OUTPUTS: ${OFFICECARE_LANGSMITH_HIDE_OUTPUTS:-true}
      OFFICECARE_REDIS_ENABLED: ${OFFICECARE_REDIS_ENABLED:-true}
      OFFICECARE_REDIS_HOST: ${OFFICECARE_REDIS_HOST:-officecare-redis}
      OFFICECARE_REDIS_PORT: ${OFFICECARE_REDIS_PORT:-6379}
      OFFICECARE_REDIS_DATABASE: ${OFFICECARE_REDIS_DATABASE:-0}
      OFFICECARE_REDIS_PASSWORD: ${OFFICECARE_REDIS_PASSWORD:?Set OFFICECARE_REDIS_PASSWORD}
      OFFICECARE_REDIS_CONNECT_TIMEOUT_SECONDS: ${OFFICECARE_REDIS_CONNECT_TIMEOUT_SECONDS:-2}
      OFFICECARE_REDIS_SOCKET_TIMEOUT_SECONDS: ${OFFICECARE_REDIS_SOCKET_TIMEOUT_SECONDS:-2}
      OFFICECARE_RAG_CACHE_TTL_SECONDS: ${OFFICECARE_RAG_CACHE_TTL_SECONDS:-3600}
      OFFICECARE_RAG_CACHE_NAMESPACE: ${OFFICECARE_RAG_CACHE_NAMESPACE:-officecare:ai:rag-answer:v1}
      OFFICECARE_MILVUS_URI: ${OFFICECARE_MILVUS_URI:?Set OFFICECARE_MILVUS_URI}
      OFFICECARE_MILVUS_TOKEN: ${OFFICECARE_MILVUS_TOKEN:-}
      OFFICECARE_MILVUS_DATABASE: ${OFFICECARE_MILVUS_DATABASE:-default}
      OFFICECARE_MILVUS_COLLECTION: ${OFFICECARE_MILVUS_COLLECTION:-officecare_document_chunks_v1}
      OFFICECARE_MILVUS_TIMEOUT_SECONDS: ${OFFICECARE_MILVUS_TIMEOUT_SECONDS:-10}
      OFFICECARE_CHUNK_SIZE: ${OFFICECARE_CHUNK_SIZE:-800}
      OFFICECARE_CHUNK_OVERLAP: ${OFFICECARE_CHUNK_OVERLAP:-100}
      OFFICECARE_RAG_TOP_K: ${OFFICECARE_RAG_TOP_K:-5}
      OFFICECARE_RAG_SCORE_THRESHOLD: ${OFFICECARE_RAG_SCORE_THRESHOLD:-0.45}
      OFFICECARE_RAG_DENSE_CANDIDATE_LIMIT: ${OFFICECARE_RAG_DENSE_CANDIDATE_LIMIT:-100}
      OFFICECARE_RAG_LEXICAL_SCAN_LIMIT: ${OFFICECARE_RAG_LEXICAL_SCAN_LIMIT:-5000}
      OFFICECARE_RAG_LEXICAL_CANDIDATE_LIMIT: ${OFFICECARE_RAG_LEXICAL_CANDIDATE_LIMIT:-100}
      OFFICECARE_RAG_LEXICAL_SCORE_THRESHOLD: ${OFFICECARE_RAG_LEXICAL_SCORE_THRESHOLD:-0.18}
      OFFICECARE_RAG_NEIGHBOR_WINDOW: ${OFFICECARE_RAG_NEIGHBOR_WINDOW:-2}
      OFFICECARE_RAG_CONTEXT_MAX_CHARS: ${OFFICECARE_RAG_CONTEXT_MAX_CHARS:-8000}
    networks:
      - officecare-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  officecare-java:
    build:
      context: ../../java-server
      dockerfile: Dockerfile
    image: officecare-server:${OFFICECARE_IMAGE_TAG:-0.1.0}
    container_name: officecare-java
    restart: unless-stopped
    depends_on:
      officecare-ai:
        condition: service_healthy
      officecare-rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: druid
      SPRING_DEVTOOLS_RESTART_ENABLED: "false"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      LOGGING_LEVEL_COM_RUOYI: info
      JAVA_OPTS: ${OFFICECARE_JAVA_OPTS:--Xms256m -Xmx768m -Dfile.encoding=UTF-8}
      RUOYI_PROFILE: /data/ruoyi-profile
      OFFICECARE_STORAGE_TYPE: local
      OFFICECARE_STORAGE_ROOT: /data/documents
      OFFICECARE_JAVA_CACHE_ENABLED: ${OFFICECARE_JAVA_CACHE_ENABLED:-true}
      OFFICECARE_JAVA_CACHE_REFERENCE_TTL: ${OFFICECARE_JAVA_CACHE_REFERENCE_TTL:-30m}
      OFFICECARE_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      OFFICECARE_DATASOURCE_HOST: ${OFFICECARE_MYSQL_HOST:-officecare-mysql}
      OFFICECARE_DATASOURCE_PORT: ${OFFICECARE_MYSQL_PORT:-3306}
      OFFICECARE_DATASOURCE_DATABASE: ${OFFICECARE_MYSQL_DATABASE:-officecare_ai}
      OFFICECARE_DATASOURCE_USERNAME: ${OFFICECARE_MYSQL_USERNAME:-officecare}
      OFFICECARE_DATASOURCE_PASSWORD: ${OFFICECARE_MYSQL_PASSWORD:?Set OFFICECARE_MYSQL_PASSWORD}
      OFFICECARE_REDIS_HOST: ${OFFICECARE_REDIS_HOST:-officecare-redis}
      OFFICECARE_REDIS_PORT: ${OFFICECARE_REDIS_PORT:-6379}
      OFFICECARE_REDIS_DATABASE: ${OFFICECARE_REDIS_DATABASE:-0}
      OFFICECARE_REDIS_PASSWORD: ${OFFICECARE_REDIS_PASSWORD:?Set OFFICECARE_REDIS_PASSWORD}
      OFFICECARE_RABBITMQ_ENABLED: "true"
      OFFICECARE_RABBITMQ_HOST: officecare-rabbitmq
      OFFICECARE_RABBITMQ_PORT: 5672
      OFFICECARE_RABBITMQ_USERNAME: ${OFFICECARE_RABBITMQ_USERNAME:?Set OFFICECARE_RABBITMQ_USERNAME}
      OFFICECARE_RABBITMQ_PASSWORD: ${OFFICECARE_RABBITMQ_PASSWORD:?Set OFFICECARE_RABBITMQ_PASSWORD}
      OFFICECARE_RABBITMQ_VHOST: ${OFFICECARE_RABBITMQ_VHOST:-/officecare}
      OFFICECARE_RABBITMQ_QUEUE_TYPE: ${OFFICECARE_RABBITMQ_QUEUE_TYPE:-quorum}
      OFFICECARE_RABBITMQ_CONSUMER_CONCURRENCY: ${OFFICECARE_RABBITMQ_CONSUMER_CONCURRENCY:-1}
      OFFICECARE_RABBITMQ_PREFETCH_COUNT: ${OFFICECARE_RABBITMQ_PREFETCH_COUNT:-1}
      OFFICECARE_RABBITMQ_OUTBOX_BATCH_SIZE: ${OFFICECARE_RABBITMQ_OUTBOX_BATCH_SIZE:-20}
      OFFICECARE_RABBITMQ_MAX_PUBLISH_ATTEMPTS: ${OFFICECARE_RABBITMQ_MAX_PUBLISH_ATTEMPTS:-10}
      OFFICECARE_RABBITMQ_RETRY_INITIAL_DELAY_SECONDS: ${OFFICECARE_RABBITMQ_RETRY_INITIAL_DELAY_SECONDS:-30}
      OFFICECARE_RABBITMQ_RETRY_MAX_DELAY_SECONDS: ${OFFICECARE_RABBITMQ_RETRY_MAX_DELAY_SECONDS:-600}
      OFFICECARE_SECURITY_TOKEN_SECRET: ${OFFICECARE_SECURITY_TOKEN_SECRET:?Set OFFICECARE_SECURITY_TOKEN_SECRET}
      OFFICECARE_AI_ENABLED: "true"
      OFFICECARE_AI_BASE_URL: http://officecare-ai-service:8000
      OFFICECARE_AI_SERVICE_TOKEN: ${OFFICECARE_AI_SERVICE_TOKEN:?Set OFFICECARE_AI_SERVICE_TOKEN}
      OFFICECARE_AI_CONNECT_TIMEOUT: ${OFFICECARE_AI_CONNECT_TIMEOUT:-5s}
      OFFICECARE_AI_READ_TIMEOUT: ${OFFICECARE_AI_READ_TIMEOUT:-120s}
      OFFICECARE_AI_PARSE_READ_TIMEOUT: ${OFFICECARE_AI_PARSE_READ_TIMEOUT:-1800s}
      OFFICECARE_AI_INDEX_READ_TIMEOUT: ${OFFICECARE_AI_INDEX_READ_TIMEOUT:-1800s}
      OFFICECARE_AI_AGENT_READ_TIMEOUT: ${OFFICECARE_AI_AGENT_READ_TIMEOUT:-240s}
      OFFICECARE_AI_TURN_WAIT_TIMEOUT: ${OFFICECARE_AI_TURN_WAIT_TIMEOUT:-60s}
      OFFICECARE_AI_TURN_LEASE: ${OFFICECARE_AI_TURN_LEASE:-360s}
      OFFICECARE_AI_TURN_WAIT_POLL_INTERVAL: ${OFFICECARE_AI_TURN_WAIT_POLL_INTERVAL:-200ms}
      OFFICECARE_AI_MAX_ATTEMPTS: ${OFFICECARE_AI_MAX_ATTEMPTS:-3}
      OFFICECARE_AI_RAG_TOP_K: ${OFFICECARE_RAG_TOP_K:-5}
      OFFICECARE_AI_RAG_SCORE_THRESHOLD: ${OFFICECARE_RAG_SCORE_THRESHOLD:-0.45}
      OFFICECARE_DRUID_USERNAME: ${OFFICECARE_DRUID_USERNAME:?Set OFFICECARE_DRUID_USERNAME}
      OFFICECARE_DRUID_PASSWORD: ${OFFICECARE_DRUID_PASSWORD:?Set OFFICECARE_DRUID_PASSWORD}
      OFFICECARE_REFERER_ALLOWED_DOMAINS: ${OFFICECARE_REFERER_ALLOWED_DOMAINS:-localhost,127.0.0.1}
    volumes:
      - type: bind
        source: ${OFFICECARE_DOCUMENTS_PATH:-/opt/officecare/data/documents}
        target: /data/documents
      - type: bind
        source: ${OFFICECARE_RUOYI_PROFILE_PATH:-/opt/officecare/data/ruoyi-profile}
        target: /data/ruoyi-profile
      - type: bind
        source: ${OFFICECARE_JAVA_LOGS_PATH:-/opt/officecare/logs/java}
        target: /home/ruoyi/logs
    networks:
      - officecare-network
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:8080/health
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s

  officecare-web:
    build:
      context: ../../web-admin
      dockerfile: Dockerfile
    image: officecare-web-admin:${OFFICECARE_IMAGE_TAG:-0.1.0}
    container_name: officecare-web
    restart: unless-stopped
    depends_on:
      officecare-java:
        condition: service_healthy
    ports:
      - "${OFFICECARE_WEB_PORT:-8088}:80"
    networks:
      - officecare-network

networks:
  officecare-network:
    external: true
    name: officecare-network

volumes:
  officecare-rabbitmq-data:
    name: officecare-rabbitmq-data
